services:
  mock-ad:
    build: ./mock/mock_ad_server
    ports:
      - "1389:1389"
    restart: unless-stopped
    volumes:
      - ./mock/mock_ad_server:/app


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  gateway:
    container_name: any-gateway
    build: .
    ports:
      - "${GATEWAY_PORT:-8003}:8003"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_KEY=${ADMIN_KEY}
      - LDAP_SERVER_URL=${LDAP_SERVER_URL:-ldap://mock-ad:1389}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_DOMAIN=${LDAP_DOMAIN:-}
      - ADMIN_FALLBACK_KEY=${ADMIN_FALLBACK_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME:-superadmin}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SKIP_SSL_VERIFY=${SKIP_SSL_VERIFY:-0}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${GATEWAY_PORT:-8003}/health" ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # HTTPS 反向代理 + ACME 自动证书（DNS-01 验证，不依赖入站 80/443）
  # 需在 .env 配置 ACME_DOMAIN 与 CLOUDFLARE_API_TOKEN，用法见 docs/https-deployment.md
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: any-gateway-caddy
    ports:
      - "8443:8443"
    environment:
      - ACME_DOMAIN=${ACME_DOMAIN}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  redis_data:
