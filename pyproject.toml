[project]
name = "any-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "brotli>=1.2.0",
    "fastapi>=0.141.1",
    "fastcrud>=0.22.3",
    "httpx>=0.28.1",
    "ldap3>=2.9.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlmodel>=0.0.42",
    "tencentcloud-sdk-python>=3.1.179",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
]
